name: Fusion targeted checks
on:
  push:
    branches:
      - experiment/pr5-pr6-fusion-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fusion-boundaries-and-three-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check isolated public security boundary and 3-profile CLI
        run: |
          python -m unittest \
            competition.tests.test_fusion_boundaries \
            competition.tests.test_bridge_facade \
            competition.tests.test_cli_session \
            competition.tests.test_server_service -v
      - name: Check IND request lifecycle and public API
        run: |
          python -m unittest \
            competition.tests.test_submission_renewal \
            competition.tests.test_operation_service -v
