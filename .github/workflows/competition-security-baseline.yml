name: Competition software checks
on:
  push:
    branches: [main, 'competition/**']
    paths:
      - 'competition/**'
      - 'system_dev/**'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/competition-security-baseline.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  competition-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install competition dependencies
        run: python -m pip install -r requirements.txt
      - name: Check current repository scope and references
        run: python -m competition.verify_repository --report .runtime/repository-check.json
      - name: Run competition component and recovery regressions
        run: python -m unittest discover -s competition/tests -v
      - name: Verify retained message schemas and encoding vectors
        run: python system_dev/v26/tools/verify_contracts.py
      - name: Verify existing signed simulator evidence against its original source commit
        run: python competition/docs/final/verify-existing-evidence.py
