name: Competition software checks
on:
  push:
    branches: [main, 'competition/**']
    paths:
      - 'competition/**'
      - 'system_dev/**'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/competition-security-baseline.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  competition-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install competition dependencies
        run: python -m pip install -r requirements.txt
      - name: Install agent gateway dependencies
        run: python -m pip install -r competition/agent/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the dsh feedback plugin
        run: node --test competition/agent/dsh-plugin/test/*.test.js
      - name: Check current repository scope and references
        run: python -m competition.verify_repository --report .runtime/repository-check.json
      - name: Run competition component and recovery regressions
        run: python -m unittest discover -s competition/tests -v
      - name: Verify retained message schemas and encoding vectors
        run: python system_dev/v26/tools/verify_contracts.py
      - name: Verify existing signed simulator evidence against its original source commit
        run: python competition/docs/final/verify-existing-evidence.py
  fusion-targeted:
    name: Fusion three-profile and security-boundary checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Assert IND public-service trust boundary
        run: python -m unittest competition.tests.test_fusion_boundaries -v
      - name: Test three-profile local CLI and bridge
        run: python -m unittest competition.tests.test_bridge_facade competition.tests.test_cli_session competition.tests.test_server_service -v
      - name: Check IND lifecycle and authenticated public service
        run: python -m unittest competition.tests.test_submission_renewal competition.tests.test_operation_service -v
