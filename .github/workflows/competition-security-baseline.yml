name: Competition software checks
on:
  push:
    branches: [main, 'competition/**']
    paths:
      - 'competition/**'
      - 'system_dev/**'
      - 'requirements.txt'
      - '*.md'
      - '.github/workflows/competition-security-baseline.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      issue:
        description: issue number（只在手动触发 agent-fix 时填，填了就不跑比赛检查）
        required: false
        type: string
  # agent-fix：新 issue 进来后在自托管 runner 上跑修复/判定/审查三阶段。
  # 本仓库的 competition/verify_repository.py 要求 .github/workflows/ 下只有
  # 一个文件，所以这两个 job 必须并在这个文件里，不能另开 workflow。
  issues:
    types: [opened]
  schedule:
    - cron: "0 4 * * *"
permissions:
  contents: read
jobs:
  competition-checks:
    if: github.event_name != 'issues' && github.event_name != 'schedule' && !github.event.inputs.issue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install competition dependencies
        run: python -m pip install -r requirements.txt
      - name: Install agent gateway dependencies
        run: python -m pip install -r competition/agent/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the dsh feedback plugin
        run: node --test competition/agent/dsh-plugin/test/*.test.js
      - name: Check current repository scope and references
        run: python -m competition.verify_repository --report .runtime/repository-check.json
      - name: Run competition component and recovery regressions
        run: python -m unittest discover -s competition/tests -v
      - name: Verify retained message schemas and encoding vectors
        run: python system_dev/v26/tools/verify_contracts.py
      - name: Verify existing signed simulator evidence against its original source commit
        run: python competition/docs/final/verify-existing-evidence.py
  fusion-targeted:
    name: Fusion three-profile and security-boundary checks
    if: github.event_name != 'issues' && github.event_name != 'schedule' && !github.event.inputs.issue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Assert IND public-service trust boundary
        run: python -m unittest competition.tests.test_fusion_boundaries -v
      - name: Test three-profile local CLI and bridge
        run: python -m unittest competition.tests.test_bridge_facade competition.tests.test_cli_session competition.tests.test_server_service -v
      - name: Check IND lifecycle and authenticated public service
        run: python -m unittest competition.tests.test_submission_renewal competition.tests.test_operation_service -v

  # 工具代码在 runner 主机的固定路径，不在被测仓库里，因此不执行 checkout。
  agent-fix:
    if: github.event_name == 'issues' || (github.event_name == 'workflow_dispatch' && github.event.inputs.issue)
    runs-on: self-hosted
    # 45 修复 + 50 判定 + 10 审查 + 开销；实测判定约 30 分钟
    timeout-minutes: 150
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ID: ${{ github.event.inputs.issue || github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: /home/umr/Projects/software-test-sandbox/scripts/runner.sh

  sweep:
    if: github.event_name == 'schedule'
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: dispatch unprocessed issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          cd /home/umr/Projects/software-test-sandbox
          gh issue list --state open --limit 20 --json number \
            --jq '.[].number' | while read -r n; do
              if [ -e "state/processed/$n" ] || [ -e "state/rejected/$n" ]; then
                continue
              fi
              gh workflow run competition-security-baseline.yml -f "issue=$n" || true
            done
