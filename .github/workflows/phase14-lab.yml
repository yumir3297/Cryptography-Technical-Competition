name: Phase14 Verifier Laboratory
on:
  push:
    branches: [research/zjj-core-phase13-handoff-20261009]
    paths:
      - 'research/phase14/**'
      - '.github/workflows/phase14-lab.yml'
  workflow_dispatch:
jobs:
  phase14:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install research dependencies
        run: python -m pip install -r requirements_phase13.txt
      - name: Run Phase14 isolated acceptance tests
        run: |
          set -o pipefail
          python -m unittest research.phase14.test_phase14 -v 2>&1 | tee phase14_test_output.txt
      - name: Execute external C/X process separated acceptance, simulated TOOL_FINAL and readonly audit
        run: |
          set -o pipefail
          python -m research.phase14.process_flow --output research/phase14/evidence/core01_process 2>&1 | tee phase14_process_output.txt
      - name: Run original 39-case dispatcher without promoting statuses
        run: |
          set -o pipefail
          python -m research.formal39.run_formal39 2>&1 | tee phase14_formal39_stdout.txt
      - name: Preserve raw experimental logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14-laboratory-logs
          path: |
            phase14_test_output.txt
            phase14_process_output.txt
            research/phase14/evidence/core01_process/**
            phase14_formal39_stdout.txt
          if-no-files-found: ignore
