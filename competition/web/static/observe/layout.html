<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZJJ-CORE · 协议观察面</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/observe/assets/prts/prts-design.css">
  <link rel="stylesheet" href="/observe/assets/observe.css">
</head>
<body class="ak-scope">
  <canvas class="ob-bg" id="ob-bg" aria-hidden="true"></canvas>

  <a class="ob-skip" href="#map">跳到总图</a>

  <header class="ob-bar">
    <div class="ob-brand">
      <span class="ob-brand__mark">ZJJ-CORE</span>
    </div>

    <div class="ob-status" role="status" aria-live="polite">
      <span class="ob-led" id="ob-session" data-state="empty"></span>
      <span class="ob-mono" id="ob-latency">—</span>
    </div>

    <div class="ob-tools">
      <label class="ob-token">
        <span class="ob-token__label">AUDITOR TOKEN</span>
        <input id="ob-token" class="ak-input ak-input--sm" type="password"
               autocomplete="off" spellcheck="false" placeholder="粘贴 token">
      </label>
      <button id="ob-token-save" type="button" class="ak-btn ak-btn--sm ak-btn--primary">保存</button>
      <button id="ob-token-clear" type="button" class="ak-btn ak-btn--sm">清除</button>
    </div>
  </header>

  <div class="ob-sub">
    <label class="ob-op">
      <span class="ob-op__label">OPERATION</span>
      <select id="ob-op" class="ak-select ak-select--sm">
        <option value="">— 未授权 —</option>
      </select>
    </label>
    <span class="ob-mono" id="ob-profile">profile —</span>
    <span class="ob-current" id="ob-current" data-state="idle">当前 —</span>
    <span class="ob-error" id="ob-error" role="status" hidden></span>
    <span class="ob-empty" id="ob-empty" hidden>还没有操作：在控制台提交后会出现在这里</span>
    <ul class="ob-legend" aria-label="四类关系">
      <li data-kind="control">控制流</li>
      <li data-kind="evidence">证据绑定</li>
      <li data-kind="feedback">状态反馈</li>
      <li data-kind="reject">阻断 / 未知</li>
    </ul>
  </div>

  <main class="ob-main">
    <section class="ob-mapwrap" id="map" aria-label="协议总图">
      <div class="ob-mapbar">
        <div class="ob-mapctl" id="ob-mapctl">
          <button type="button" class="ob-hud__btn ob-zoom__btn"
                  id="ob-map-out" aria-label="缩小总图">−</button>
          <span class="ob-zoom__val" id="ob-map-zoom">—</span>
          <button type="button" class="ob-hud__btn ob-zoom__btn"
                  id="ob-map-in" aria-label="放大总图">+</button>
          <button type="button" class="ob-hud__btn" id="ob-map-fit">适应</button>
          <span class="ob-mapctl__hint">拖动平移 · 滚轮缩放 · 点块展开</span>
        </div>
        <div class="ob-hud" id="ob-hud" hidden>
          <div class="ob-hud__bar">
            <span class="ob-hud__code" id="ob-hud-code"></span>
            <span class="ob-hud__name" id="ob-hud-name"></span>
            <span class="ob-hud__en" id="ob-hud-en"></span>
            <span class="ob-zoom">
              <button type="button" class="ob-hud__btn ob-zoom__btn"
                      id="ob-zoom-out" title="缩小">−</button>
              <span class="ob-zoom__val" id="ob-zoom-val">—</span>
              <button type="button" class="ob-hud__btn ob-zoom__btn"
                      id="ob-zoom-in" title="放大">+</button>
            </span>
            <button type="button" class="ob-hud__btn" id="ob-hud-raw"
                    aria-expanded="false">字段</button>
            <button type="button" class="ob-hud__btn ob-hud__btn--back" data-back>全图</button>
          </div>
          <div class="ob-hud__panel" id="ob-hud-panel" hidden>
<!-- {{HUD}} -->
          </div>
        </div>
      </div>

      <div class="ob-graph" data-graph="map" id="ob-graph">
        <div class="ob-canvas">
          <svg class="ob-edges" aria-hidden="true" focusable="false"></svg>
          <div class="ob-nodes">
<!-- {{MAP}} -->
          </div>
        </div>
<!-- {{EXPAND}} -->
      </div>
    </section>
  </main>

  <script src="/observe/assets/vendor/dagre.min.js" defer></script>
  <script src="/observe/assets/observe.js" defer></script>
  <script type="module" src="/observe/assets/observe-backdrop.js"></script>
</body>
</html>
